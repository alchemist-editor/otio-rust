[package]
name = "otio-ext-sync"
description = "Timeline sync for otio-rust: sharing an OpenTimelineIO timeline between programs while it is edited. An otio-rust extension, not part of OpenTimelineIO."
keywords = ["opentimelineio", "otio", "sync", "collaboration"]
categories = ["multimedia::video"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
otio-adapter.workspace = true
otio-core.workspace = true
otio-ext.workspace = true

# The operating system's random source, for the default identity's
# credential. WebAssembly builds have none without JavaScript glue, so there
# a program passes its own credential.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = "0.3"

[lints]
workspace = true
