name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `otio-python` is left out here and built by the Python job below. It
      # is a Python extension module, so linking it needs flags that come
      # from maturin rather than from cargo: on macOS, plain `cargo build`
      # has no way to know its Python symbols are resolved at import time and
      # fails with "symbol(s) not found". It has no Rust tests of its own, so
      # nothing is lost.
      - name: Build
        run: cargo build --workspace --exclude otio-python --all-targets
      - name: Test
        run: cargo test --workspace --exclude otio-python

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"
      - name: Build and install the wheel
        run: pip install .
        working-directory: crates/otio-python
      - name: Upstream's own test suite
        run: python tests/run_upstream_tests.py
        working-directory: crates/otio-python

  c-abi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The header and the C program are checked by the workspace test job
      # too, but there the C test skips itself if the runner has no compiler.
      # Here it is not allowed to: this job exists to prove the ABI, so a
      # runner without a C compiler has to be a failure rather than a pass.
      - name: Build the library
        run: cargo build -p otio-capi
      - name: Link a C program against it
        run: cargo test -p otio-capi -- --nocapture
        env:
          OTIO_CAPI_REQUIRE_CC: "1"

  go:
    name: Go SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows. The module is cgo, and linking a Rust static library with
      # MSVC needs an environment the runner does not have set up; the C ABI
      # job leaves Windows out for the same reason.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build the C library
        run: cargo build -p otio-capi --release
      - name: Put it where the module links against it
        run: cp target/release/libotio.a sdk/go/lib/
      - name: Format
        # The generator writes gofmt's own formatting, so anything listed
        # here is the generator's bug rather than a contributor's.
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
        working-directory: sdk/go
      - name: Vet
        run: go vet ./...
        working-directory: sdk/go
      - name: Test
        run: go test ./...
        working-directory: sdk/go

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # This one keeps `otio-python` in: linking the extension module works
      # on Linux without maturin's help, so the job still proves PyO3 builds
      # under the declared minimum.
      - name: Build
        run: cargo build --workspace
