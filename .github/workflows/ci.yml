name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push supersedes the run it interrupted. Pushes to `main` are left
# alone: that history is what a release comes off, so every commit on it
# gets its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The shape, in stages. Each stage gates the next, so a failure that would
# have failed everything downstream stops before the fan-out pays for it:
#
#   changes ─▶ lint ─┬─▶ library (ubuntu, macos) ─┬─▶ Go / Swift / Zig /
#                    │                             │   C++ / C# / Objective-C
#                    ├─▶ generated ───────────────┘
#                    ├─▶ test (ubuntu, macos, windows)
#                    ├─▶ C ABI · Python · MSRV
#                    ├─▶ TypeScript
#                    └─▶ Documentation site
#
# `changes` decides which of them are needed at all; see
# `.github/ci/select-jobs.sh`. `library` builds `libotio.a` once per
# platform and hands it to the SDK jobs as an artifact, so those jobs need
# no Rust toolchain of their own.
#
# Every job is downstream of `ci`, which is the one check worth requiring in
# branch protection: it is the only one that is always reported.

jobs:
  changes:
    name: What to run
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.select.outputs.any }}
      rust: ${{ steps.select.outputs.rust }}
      python: ${{ steps.select.outputs.python }}
      capi: ${{ steps.select.outputs.capi }}
      library: ${{ steps.select.outputs.library }}
      go: ${{ steps.select.outputs.go }}
      swift: ${{ steps.select.outputs.swift }}
      zig: ${{ steps.select.outputs.zig }}
      cpp: ${{ steps.select.outputs.cpp }}
      csharp: ${{ steps.select.outputs.csharp }}
      objc: ${{ steps.select.outputs.objc }}
      ts: ${{ steps.select.outputs.ts }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The selector still agrees with its own table
        run: .github/ci/select-jobs.sh --self-test
      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
          # The pull request's whole diff against its merge base, not the
          # paths of the last push. CI has to have a verdict on what would
          # be merged, so a documentation commit on top of a change under
          # `crates/` still runs everything.
          pull_request) range="$BASE...$HEAD" ;;
          # A push to `main`: what the push changed, from the commit `main`
          # was on before it. A merge that reaches the workspace still runs
          # everything; one that touched only prose or the site does not
          # pay for every SDK again after its pull request already did.
          # A new branch has no `before`, and a force-push can leave one
          # this clone never fetched; both run everything below.
          push)
            if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
              echo "a push with no previous commit: running everything"
              .github/ci/select-jobs.sh --all | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
            range="$BEFORE..$AFTER"
            ;;
          *)
            echo "a $EVENT: running everything"
            .github/ci/select-jobs.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
            ;;
          esac
          if ! git diff --name-only "$range" > changed-paths.txt; then
            echo "could not read the diff $range: running everything"
            .github/ci/select-jobs.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed ($range):"
          sed 's/^/  /' changed-paths.txt
          echo "running:"
          .github/ci/select-jobs.sh < changed-paths.txt | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  library:
    name: Core library (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.library == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The two platforms the compiled SDKs are built on. Windows is left
      # out for the reason every SDK job leaves it out: linking a Rust
      # static library there needs an MSVC environment the runner does not
      # have set up.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p otio-capi --release
      # Every SDK job used to build this itself. Building it once per
      # platform and handing it over is the same bytes, four times less
      # work, and it is what makes those jobs downstream of this one rather
      # than four copies of it.
      - uses: actions/upload-artifact@v4
        with:
          name: libotio-${{ matrix.os }}
          path: target/release/libotio.a
          retention-days: 1
          if-no-files-found: error
      # C# loads the library by name at run time rather than linking it, so
      # it needs the shared one. The same build produces both, and they go
      # in separate artifacts because a `.so` sitting beside the `.a` would
      # change what `-lotio` picks for everyone who does link it.
      - uses: actions/upload-artifact@v4
        with:
          name: libotio-shared-${{ matrix.os }}
          path: |
            target/release/libotio.so
            target/release/libotio.dylib
          retention-days: 1
          if-no-files-found: error

  generated:
    name: Generated SDKs are current
    needs: [changes, lint]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Everything under `sdk/`, plus the TypeScript package and the wasm
      # crate's layout, is written from the source of `crates/otio-capi` —
      # its doc comments included, not just its signatures. This fails if
      # what is committed is not what the generator would write today. It
      # runs on any change at all, because almost anything can reach it: a
      # reworded comment in the C ABI, a hand edit to a generated file, a
      # change to a backend.
      - name: The SDKs are what the C ABI says they should be
        run: cargo run -p otio-sdk-gen -- --check

  test:
    name: Test (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `otio-python` is left out here and built by the Python job below. It
      # is a Python extension module, so linking it needs flags that come
      # from maturin rather than from cargo: on macOS, plain `cargo build`
      # has no way to know its Python symbols are resolved at import time and
      # fails with "symbol(s) not found". It has no Rust tests of its own, so
      # nothing is lost.
      #
      # The build is its own step, and has to stay one: the C ABI test links
      # whatever `libotio` is on disk when it runs, and cargo does not order
      # that against building it, so a `cargo test` that also builds can
      # test the previous library.
      - name: Build
        run: cargo build --workspace --exclude otio-python --all-targets
      - name: Test
        run: cargo test --workspace --exclude otio-python
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs rust

  python:
    name: Python bindings (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin, and pytest for the adapter suites
        run: pip install "maturin>=1.5,<2.0" "pytest>=8"
      - name: Build and install the wheel
        run: pip install .
        working-directory: crates/otio-python
      - name: Upstream's own test suite
        run: python tests/run_upstream_tests.py
        working-directory: crates/otio-python
      - name: Upstream's adapter test suites
        run: python tests/run_adapter_tests.py
        working-directory: crates/otio-python
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs python

  c-abi:
    name: C ABI (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.capi == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The header and the C program are checked by the workspace test job
      # too, but there the C test skips itself if the runner has no compiler.
      # Here it is not allowed to: this job exists to prove the ABI, so a
      # runner without a C compiler has to be a failure rather than a pass.
      #
      # Building first is not tidiness: the C program links the library that
      # is on disk, so a `cargo test` that builds it in the same invocation
      # can run against the previous one.
      - name: Build the library
        run: cargo build -p otio-capi
      - name: Link a C program against it
        run: cargo test -p otio-capi -- --nocapture
        env:
          OTIO_CAPI_REQUIRE_CC: "1"
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs c

  msrv:
    name: Minimum supported Rust version
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # This one keeps `otio-python` in: linking the extension module works
      # on Linux without maturin's help, so the job still proves PyO3 builds
      # under the declared minimum.
      - name: Build
        run: cargo build --workspace

  go:
    name: Go SDK (${{ matrix.os }})
    needs: [changes, library, generated]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows. The module is cgo, and linking a Rust static library with
      # MSVC needs an environment the runner does not have set up; the C ABI
      # job leaves Windows out for the same reason.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/download-artifact@v4
        with:
          name: libotio-${{ matrix.os }}
          path: sdk/go/lib
      - name: Format
        # The generator writes gofmt's own formatting, so anything listed
        # here is the generator's bug rather than a contributor's.
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
        working-directory: sdk/go
      - name: Vet
        run: go vet ./...
        working-directory: sdk/go
      - name: Test
        run: go test ./...
        working-directory: sdk/go
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs go

  swift:
    name: Swift SDK (${{ matrix.os }})
    needs: [changes, library, generated]
    if: needs.changes.outputs.swift == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows. The package links the Rust static library through clang,
      # which needs the MSVC environment the runner does not have set up; the
      # C ABI and Go jobs leave Windows out for the same reason.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # macOS runners ship Swift with Xcode; Linux ones do not.
      - name: Install Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - uses: actions/download-artifact@v4
        with:
          name: libotio-${{ matrix.os }}
          path: sdk/swift/lib
      - name: Build
        run: swift build -Xlinker -L"$PWD/lib"
        working-directory: sdk/swift
      - name: Test
        run: swift test -Xlinker -L"$PWD/lib"
        working-directory: sdk/swift
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs swift

  zig:
    name: Zig SDK (${{ matrix.os }})
    needs: [changes, library, generated]
    if: needs.changes.outputs.zig == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows, for the same reason the C ABI and Go jobs leave it out:
      # linking a Rust static library with MSVC needs an environment the
      # runner does not have set up.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/download-artifact@v4
        with:
          name: libotio-${{ matrix.os }}
          path: sdk/zig/lib
      - name: Format
        # The generator writes zig fmt's own formatting, so anything listed
        # here is the generator's bug rather than a contributor's.
        run: zig fmt --check .
        working-directory: sdk/zig
      - name: Test
        run: zig build test
        working-directory: sdk/zig
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs zig

  cpp:
    name: C++ SDK (${{ matrix.os }})
    needs: [changes, library, generated]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows, for the reason every other SDK job leaves it out: the
      # package links the Rust static library through the platform's own C++
      # driver, which the runner does not have set up for MSVC.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libotio-${{ matrix.os }}
          path: sdk/cpp/lib
      - name: Configure
        run: cmake -S sdk/cpp -B sdk/cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build sdk/cpp/build
      - name: Test
        run: ctest --test-dir sdk/cpp/build --output-on-failure
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs cpp

  csharp:
    name: C# SDK (${{ matrix.os }})
    needs: [changes, library, generated]
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows, for the reason every other SDK job leaves it out: the
      # core library is built for these two platforms only. Nothing in this
      # SDK is otherwise Unix-specific — .NET would load `otio.dll` the same
      # way — so this is where to start when Windows is worth adding.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: libotio-shared-${{ matrix.os }}
          path: sdk/csharp/lib
      # The project treats warnings as errors, so this is also where a
      # missing doc comment or a nullability mistake in generated code
      # fails.
      - name: Build
        run: dotnet build --configuration Release
        working-directory: sdk/csharp/OpenTimelineIO
      - name: Test
        run: dotnet run --configuration Release --project tests
        working-directory: sdk/csharp
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs csharp

  objc:
    name: Objective-C SDK (${{ matrix.os }})
    needs: [changes, library, generated]
    if: needs.changes.outputs.objc == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both runtimes, on purpose: macOS builds these sources under ARC on
      # Apple's runtime, Linux under manual retain and release on GNUstep's.
      # The SDK is written for both, so both are proved.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # macOS ships Objective-C with Xcode; Linux needs GNUstep's Foundation
      # and a clang that can build against it. GCC's Objective-C front end is
      # a decade behind and cannot build these sources.
      # `gobjc` is what brings `libobjc-N-dev`, which owns both `objc/objc.h`
      # and the `libobjc.so` the linker resolves `-lobjc` against; GNUstep
      # itself only needs the runtime `.so.4`.
      - name: Install GNUstep
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gnustep-devel gobjc
      - uses: actions/download-artifact@v4
        with:
          name: libotio-${{ matrix.os }}
          path: sdk/objc/lib
      # The Makefile builds with -Wall -Wextra -Werror, so this is also
      # where a warning in generated code fails.
      - name: Build
        run: make
        working-directory: sdk/objc
      - name: Test
        run: make check
        working-directory: sdk/objc
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs objectivec

  typescript:
    name: TypeScript SDK
    needs: [changes, lint, generated]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    # This one builds its own core: the package compiles the wasm crate
    # rather than linking `libotio.a`, so the artifact the other SDK jobs
    # take is no use to it.
    defaults:
      run:
        working-directory: crates/otio-wasm/ts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/otio-wasm/ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: The documentation samples still compile
        run: node site/scripts/compile-samples.mjs typescript
        working-directory: .
      - name: Test in Node
        run: npm test
      # What the release workflow publishes, checked on every change to it
      # rather than for the first time on the day of a release.
      - name: The tarball is complete and works once installed
        run: npm run check:pack
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test in a browser
        run: npm run test:browser

  site:
    name: Documentation site
    needs: [changes, lint]
    # `lint` only runs when a change reaches Rust or an SDK, so a change to
    # the site alone skips it — and a job whose `needs` were skipped is
    # skipped too unless its condition says otherwise. Without `!cancelled()`
    # and the explicit check on lint, a pull request touching nothing but
    # the site never ran this job at all.
    if: ${{ !cancelled() && needs.changes.outputs.site == 'true' && needs.lint.result != 'failure' }}
    runs-on: ubuntu-latest
    # No toolchain but Node. What this job cannot check is whether the
    # samples still compile — that happens in each language's own job, which
    # has the toolchain and the library for it.
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      # The switcher on every code sample promises that picking a language
      # gets you that language. This is what keeps the promise: a sample
      # missing a language, with no note saying why, fails here rather than
      # showing a reader the wrong one.
      - name: Every sample covers every language
        run: npm run check:samples
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # The site defines the grammars the highlighter does not ship — Rust,
      # Swift, Zig, C, C# and Objective-C. These are their fixtures.
      - name: Test
        run: npm test
      # The reference pages are generated from sdk/api.json and the committed
      # header, so a change to the C ABI that nobody regenerated for fails
      # the build here too.
      - name: Build
        run: npm run build

  # The one check to require in branch protection.
  #
  # A required check that is skipped is never reported, and a pull request
  # waiting on one can never merge — which is what would happen to `Test
  # (windows-latest)` the first time somebody fixed a typo in the README.
  # This job is reported on every run, whatever ran, and it passes only if
  # nothing that did run failed. A skipped job is a pass here, because a job
  # that was not needed is not a result.
  ci:
    name: CI complete
    if: always()
    needs:
      - changes
      - lint
      - library
      - generated
      - test
      - python
      - c-abi
      - msrv
      - go
      - swift
      - zig
      - cpp
      - csharp
      - objc
      - typescript
      - site
    runs-on: ubuntu-latest
    steps:
      - name: Everything that ran, passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          failed=$(printf '%s' "$RESULTS" |
            jq -r '[to_entries[]
                    | select(.value.result == "failure" or .value.result == "cancelled")
                    | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::did not pass: $failed"
            exit 1
          fi
          echo "green"
