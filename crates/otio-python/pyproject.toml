[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "opentimelineio"
description = "An editorial interchange format and library, on a Rust core."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
# The package is mixed: a Rust extension module inside a Python package whose
# other modules are ordinary source files.
python-source = "python"
module-name = "opentimelineio._opentime"
manifest-path = "Cargo.toml"
