[package]
name = "otio-python"
description = "Python bindings for the otio-rust core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The module Python imports is `opentimelineio._otio`, so the shared object
# has to be named after it; maturin does the renaming.
name = "_otio"
crate-type = ["cdylib"]

[dependencies]
opentime.workspace = true
otio-core = { version = "0.1.0", path = "../otio-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }

[lints.rust]
missing_docs = "warn"
# Not `forbid`, as the rest of the workspace has it: PyO3's attribute macros
# expand to `unsafe impl` blocks in this crate, so the lint has to be one this
# crate's own code can satisfy rather than one nothing may write.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
