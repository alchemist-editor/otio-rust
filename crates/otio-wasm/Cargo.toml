[package]
name = "otio-wasm"
description = "The otio-rust C ABI built for WebAssembly, and its TypeScript SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
# Not `otio`, which is what `otio-capi` already calls its library: two lib
# targets with one name collide in `target/`. The artefact is `otio_wasm.wasm`,
# which is the file the npm package ships.
name = "otio_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Renamed, because the crate's library is called `otio`.
otio = { package = "otio-capi", version = "0.1.0", path = "../otio-capi" }

[lints.rust]
missing_docs = "warn"
# The allocator this crate adds to the C ABI hands raw pointers to JavaScript,
# which is the one thing it exists to do.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
